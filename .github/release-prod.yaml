name: Release to Production

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - id: vars
        run: echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-latest

  deploy-prod:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - name: Deploy (mocked)
        run: |
          echo "Deploying image ghcr.io/${{ github.repository }}:${{ needs.build-and-push.outputs.image_tag }} to prd environment"
          echo "Deployment to production completed successfully (mocked)"

  smoke-test:
    needs: deploy-prod
    runs-on: ubuntu-latest
    steps:
      - name: Post-deploy smoke test (mocked)
        run: |
          echo "Running smoke test against prod (tag: ${{ needs.deploy-prod.outputs.image_tag }}): GET /health"
          echo "Smoke test passed (mocked): {\"status\": \"ok\"}"

  rollback:
    needs: [deploy-prod, smoke-test]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Rollback (mocked)
        run: |
          echo "Deploy or smoke test failed - rolling back prod from ${{ needs.deploy-prod.outputs.image_tag }} to previous stable tag"
          echo "Rollback completed (mocked)"